name: Beta macOS

# Compila "Modelador de Sistemas 2.0 Beta" en un Mac de GitHub y publica el
# .dmg y el .zip como pre-release. Se lanza a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la pre-release (por ejemplo v2.0.0-beta.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b && npm run lint && npm test
      - name: Compilar la app beta
        run: SKIP_INSTALL=1 zsh scripts/build-macos-app.sh
      - name: Publicar pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Modelador de Sistemas $TAG" \
            --notes-file REDISENO-V2.md \
            build/Modelador-de-Sistemas-2.0-Beta-macOS.dmg \
            build/Modelador-de-Sistemas-2.0-Beta-macOS.zip
