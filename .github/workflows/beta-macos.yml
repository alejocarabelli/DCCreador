name: Beta macOS

# Compila "Modelador de Sistemas 2.0 Beta" en un Mac de GitHub.
# - Cada push a rediseno-v2: compila y guarda el .dmg y el .zip como artefacto.
# - Una etiqueta v2.*-beta.*: además publica ambos como pre-release.
on:
  push:
    branches: [rediseno-v2]
    tags: ['v2.*-beta.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b && npm run lint && npm test
      - name: Compilar la app beta
        run: SKIP_INSTALL=1 zsh scripts/build-macos-app.sh
      - name: Guardar la compilación
        uses: actions/upload-artifact@v4
        with:
          name: modelador-2.0-beta
          path: |
            build/Modelador-de-Sistemas-2.0-Beta-macOS.dmg
            build/Modelador-de-Sistemas-2.0-Beta-macOS.zip
      - name: Publicar pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "Modelador de Sistemas $GITHUB_REF_NAME" \
            --notes-file REDISENO-V2.md \
            build/Modelador-de-Sistemas-2.0-Beta-macOS.dmg \
            build/Modelador-de-Sistemas-2.0-Beta-macOS.zip
