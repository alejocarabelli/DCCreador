name: macOS 2.0

# Compila "Modelador de Sistemas" (2.x) en un Mac de GitHub.
# - Cada push a main: compila y guarda el .dmg y el .zip como artefacto.
# - Una etiqueta v2.*: además publica ambos en una release (pre-release si la
#   etiqueta lleva sufijo, como v2.0.0-rc.1).
on:
  push:
    branches: [main]
    tags: ['v2.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b && npm run lint && npm test
      - name: Compilar la app
        run: SKIP_INSTALL=1 zsh scripts/build-macos-app.sh
      - name: Guardar la compilación
        uses: actions/upload-artifact@v4
        with:
          name: modelador-2.0
          path: |
            build/Modelador-de-Sistemas-2.0-macOS.dmg
            build/Modelador-de-Sistemas-2.0-macOS.zip
      - name: Publicar pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            $PRERELEASE \
            --title "Modelador de Sistemas $GITHUB_REF_NAME" \
            --notes-file REDISENO-V2.md \
            build/Modelador-de-Sistemas-2.0-macOS.dmg \
            build/Modelador-de-Sistemas-2.0-macOS.zip
